            <h4>Stay Connected with the Counter Surveillance Initiative</h4>
            <p>
              Receive updates, resources, and information about participating

                <div class="ml-field-group ml-field-email ml-validate-email ml-validate-required">
                  <label for="csi-email">Email Address</label>
                  <input
                    id="csi-email"
                    type="email"
                    class="form-control"
                    name="fields[email]"
                    placeholder="Enter your email address"
                    autocomplete="email"
                    aria-required="true"
                    required>
                </div>
              </div>

              <!-- INTEREST -->

                <div class="ml-field-group">
                  <label for="csi-interest">What are you interested in?</label>
                  <select
                    id="csi-interest"
                    class="custom-select"
                    name="fields[interest]"
                    aria-label="What are you interested in?"
                    required>
                    <option value="" selected disabled>
                      Select your interest
                    </option>
                    <option value="Joining the initiative">
                      Joining the initiative
                    </option>
                    <option value="Seeking assistance">
                      Seeking assistance
                    </option>
                    <option value="Both">

            </div>

                Join the Mailing List

                      style="display:none;"
                      type="button"
                      class="loading">
